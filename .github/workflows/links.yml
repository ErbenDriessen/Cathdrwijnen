name: Links

on:
  push:
    branches: [ Demo ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in HTML & Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          # Verifies internal links (pages, assets) and reliable external hosts.
          # Bot-hostile / non-GET endpoints and the self-hosted Pages URLs
          # (which race the deploy) are excluded to keep the check stable.
          args: >-
            --no-progress
            --max-retries 2
            --exclude 'instagram\.com'
            --exclude 'formspree\.io'
            --exclude 'erbendriessen\.github\.io'
            './**/*.html'
            './**/*.md'
          fail: true
